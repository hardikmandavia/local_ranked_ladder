# Daily data refresh: pull the league workbook from OneDrive, regenerate
# public/data/league.json, commit it, then build and deploy the site to
# GitHub Pages. Also runnable by hand from the Actions tab.
name: Refresh data & deploy

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch workbook and write league.json
        run: npm run refresh
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}

      # Microsoft rotates the refresh token on every use, and consumer tokens
      # expire after 90 days without use — store the new one so the next run
      # still works. Needs a PAT with "secrets: write" on this repo, stored as
      # SECRETS_PAT (the default GITHUB_TOKEN cannot write secrets).
      - name: Rotate MS_REFRESH_TOKEN secret
        if: ${{ env.SECRETS_PAT != '' }}
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          token=$(node -p 'require("./.token-cache.json").refresh_token')
          if [ -n "$token" ] && [ "$token" != "undefined" ]; then
            gh secret set MS_REFRESH_TOKEN --body "$token"
          fi

      - name: Warn if the rotated token could not be saved
        if: ${{ env.SECRETS_PAT == '' }}
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: echo "::warning::SECRETS_PAT is not set, so the rotated refresh token was not saved back to MS_REFRESH_TOKEN."

      - name: Commit league.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/league.json
          if git diff --cached --quiet; then
            echo "league.json unchanged"
          else
            git commit -m "data: refresh league.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - run: npm test

      - name: Build site
        run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
